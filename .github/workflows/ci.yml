name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally.
      - name: Artifacts directory
        shell: bash
        run: echo "ArtifactsPath=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore RecursiveAI.OneModelContext.slnx
      - name: Build
        run: dotnet build RecursiveAI.OneModelContext.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution RecursiveAI.OneModelContext.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack RecursiveAI.OneModelContext.slnx -c Release --no-build -o "${{ runner.temp }}/packages"
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish the AOT smoke program (IL and AOT warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish tests/RecursiveAI.OneModelContext.AotSmoke -c Release -p:SmokeMode=aot -r ${{ matrix.rid }} -o "$RUNNER_TEMP/smoke" 2>&1 | tee "$RUNNER_TEMP/aot-publish.log"
          # Keep compiler and IL warnings fatal, without promoting native linker debug-info notices.
          if grep -Ei 'warning[[:space:]]+(IL[0-9]+|AOT)' "$RUNNER_TEMP/aot-publish.log"; then
            echo "IL or AOT warnings found during publish" >&2
            exit 1
          fi
      - name: Run the AOT smoke program
        shell: bash
        run: |
          exe="$RUNNER_TEMP/smoke/RecursiveAI.OneModelContext.AotSmoke"
          [ -x "$exe" ] || exe="$exe.exe"
          "$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rid == 'linux-x64'
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  conformance:
    # Runs the scenarios named in conformance/scenarios.txt against the servers and clients built from this tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Directories outside the checkout
        run: |
          echo "ArtifactsPath=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "ONEMODELCONTEXT_CONFORMANCE_CACHE=$RUNNER_TEMP/conformance-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned suite and list its scenarios
        run: |
          conformance/run.sh install
          conformance/run.sh list > "$RUNNER_TEMP/scenarios-available.txt"
      - name: Run the server scenarios on MapModelContext
        run: conformance/regression-http.sh aspnetcore --out "$RUNNER_TEMP/conformance-results"
      - name: Run the server scenarios on the built-in listener
        run: conformance/regression-http.sh listener --out "$RUNNER_TEMP/conformance-results-listener"
      - name: Run the authorization scenarios on the conformance client
        run: |
          dotnet build conformance/Client -c Release
          conformance/run.sh regression --only client --out "$RUNNER_TEMP/conformance-results-client" --command "dotnet $ArtifactsPath/bin/RecursiveAI.OneModelContext.ConformanceClient/release/RecursiveAI.OneModelContext.ConformanceClient.dll"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results
          path: |
            ${{ runner.temp }}/conformance-results
            ${{ runner.temp }}/conformance-results-listener
            ${{ runner.temp }}/conformance-results-client
          if-no-files-found: ignore
